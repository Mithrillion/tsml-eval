name: tsml_dev
channels:
  - conda-forge
  - nvidia
  - rapidsai
dependencies:
  - python=3.11
  - pytorch>=2.5.1=*cuda*
  - torchvision
  - torchaudio
  - einops
  - ipykernel
  - jupyter
  - numpy
  - scipy
  - matplotlib
  - scikit-learn
  - pandas
  - polars
  - pyarrow
  - black
  - xarray
  - tqdm
  - pip
  - optuna
  - cuda-nvcc>=12.1
  - cuda-version>=12.1
  - cxx-compiler
  - nvidia::cuda-toolkit>=12.1
  - pytest
  - tsml-eval
  - pywavelets
  - cudf
  - cuml
  - cuvs
  - cupy>=13.3
  - openpyxl
  - pip:
    - iisignature
    - autorank
    - git+https://github.com/patrick-kidger/signatory.git